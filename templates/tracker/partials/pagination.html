{% if page.has_other_pages %}<nav class="pagination" aria-label="Page navigation"><span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} total</span><div class="pagination-links">{% if page.has_previous %}<a class="button" href="?page={{ page.previous_page_number }}">Previous</a>{% endif %}{% if page.has_next %}<a class="button" href="?page={{ page.next_page_number }}">Next</a>{% endif %}</div></nav>{% endif %}
