<form class="theme-switch" method="post" action="{% url 'appearance' %}" data-theme-switch>{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  <div class="theme-options" role="group" aria-label="Appearance">
    <button type="submit" name="theme" value="dark" title="Dark" aria-pressed="{% if theme == 'dark' %}true{% else %}false{% endif %}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.25A8.25 8.25 0 0 1 9.75 4 8.25 8.25 0 1 0 20 14.25Z"/></svg><span>Dark</span></button>
    <button type="submit" name="theme" value="light" title="Light" aria-pressed="{% if theme == 'light' %}true{% else %}false{% endif %}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.75"/><path d="M12 2.75v2M12 19.25v2M2.75 12h2M19.25 12h2M5.45 5.45l1.4 1.4M17.15 17.15l1.4 1.4M5.45 18.55l1.4-1.4M17.15 6.85l1.4-1.4"/></svg><span>Light</span></button>
    <button type="submit" name="theme" value="system" title="Auto: match this device" aria-pressed="{% if theme == 'system' %}true{% else %}false{% endif %}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2.5"/><path d="M9 20.25h6M12 16.5v3.75"/></svg><span>Auto</span></button>
  </div>
</form>
